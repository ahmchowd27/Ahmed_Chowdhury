<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif">
  <title id="title">PatchPilot maintenance workflow illustration</title>
  <desc id="desc">An issue is scanned and planned, a patch is prepared in a sandbox, checks run, and a person reviews the diff.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#1b1116"/>
      <stop offset="1" stop-color="#0a0b11"/>
    </linearGradient>
    <linearGradient id="accent" x2="1" y2="1">
      <stop stop-color="#ef4444"/>
      <stop offset=".55" stop-color="#f97316"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#fb923c"/>
    </marker>
  </defs>
  <rect width="1200" height="400" fill="url(#background)"/>
  <path d="M0 55H1200M0 345H1200" stroke="#7f1d1d" stroke-opacity=".45"/>
  <text x="42" y="36" fill="#fbbf24" font-size="13" letter-spacing="3" font-weight="700">PATCHPILOT</text>
  <text x="1158" y="36" text-anchor="end" fill="#9ca3af" font-size="12" letter-spacing="1.5">SANDBOXED WORKFLOW DESIGN</text>
  <text x="42" y="376" fill="#9ca3af" font-size="12">AGENTIC MAINTENANCE / VALIDATION / HUMAN REVIEW</text>
  <text x="1158" y="376" text-anchor="end" fill="#9ca3af" font-size="12">ILLUSTRATIVE DIFF</text>

  <rect x="42" y="112" width="188" height="176" rx="14" fill="#15151c" stroke="#713f37"/>
  <circle cx="136" cy="169" r="28" fill="#3b1f1d" stroke="#ef4444" stroke-width="2"/>
  <path d="M136 153v21M136 181v2" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
  <text x="136" y="229" text-anchor="middle" fill="#f9fafb" font-size="17" font-weight="700">Scan</text>
  <text x="136" y="250" text-anchor="middle" fill="#9ca3af" font-size="12">Dependency issue</text>
  <path d="M230 200H280" stroke="#fb923c" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="291" y="112" width="188" height="176" rx="14" fill="#15151c" stroke="#713f37"/>
  <path d="M359 149h51v61h-51zM370 165h29M370 178h29M370 191h20" fill="none" stroke="#fb923c" stroke-width="2"/>
  <text x="385" y="229" text-anchor="middle" fill="#f9fafb" font-size="17" font-weight="700">Plan</text>
  <text x="385" y="250" text-anchor="middle" fill="#9ca3af" font-size="12">Bounded changes</text>
  <path d="M479 200H529" stroke="#fb923c" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="540" y="91" width="218" height="218" rx="16" fill="#231716" stroke="url(#accent)" stroke-width="2.5"/>
  <rect x="568" y="121" width="162" height="85" rx="7" fill="#0b0b11" stroke="#374151"/>
  <text x="580" y="145" fill="#9ca3af" font-size="12" font-family="monospace">demo/build.gradle.kts</text>
  <text x="580" y="168" fill="#fca5a5" font-size="14" font-family="monospace">- 1.0.0</text>
  <text x="580" y="189" fill="#86efac" font-size="14" font-family="monospace">+ 1.0.1</text>
  <text x="649" y="248" text-anchor="middle" fill="#f9fafb" font-size="18" font-weight="700">Patch in sandbox</text>
  <text x="649" y="269" text-anchor="middle" fill="#d1d5db" font-size="12">No arbitrary repos</text>
  <path d="M758 200H808" stroke="#fb923c" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="819" y="112" width="150" height="176" rx="14" fill="#15151c" stroke="#713f37"/>
  <circle cx="894" cy="171" r="28" fill="#173329" stroke="#86efac" stroke-width="2"/>
  <path d="M881 171l9 9 17-20" fill="none" stroke="#86efac" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="894" y="229" text-anchor="middle" fill="#f9fafb" font-size="17" font-weight="700">Validate</text>
  <text x="894" y="250" text-anchor="middle" fill="#9ca3af" font-size="12">Build + tests</text>
  <path d="M969 200H1012" stroke="#fb923c" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1023" y="112" width="135" height="176" rx="14" fill="#15151c" stroke="#fbbf24" stroke-width="1.5"/>
  <path d="M1090 143l25 10v18c0 19-11 30-25 36-14-6-25-17-25-36v-18z" fill="#352318" stroke="#fbbf24" stroke-width="2"/>
  <path d="M1079 173l9 9 16-19" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1090" y="230" text-anchor="middle" fill="#f9fafb" font-size="17" font-weight="700">Review</text>
  <text x="1090" y="251" text-anchor="middle" fill="#fbbf24" font-size="12">Human required</text>
</svg>
