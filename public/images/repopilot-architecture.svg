<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif">
  <title id="title">RepoPilot code retrieval illustration</title>
  <desc id="desc">Synthetic repositories feed lexical and semantic retrieval, reciprocal rank fusion, an MCP interface, and a coding agent.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#18101a"/>
      <stop offset="1" stop-color="#0b0b11"/>
    </linearGradient>
    <linearGradient id="accent" x2="1" y2="1">
      <stop stop-color="#ef4444"/>
      <stop offset=".52" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#f97316" stop-opacity=".2"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#fb923c"/>
    </marker>
  </defs>
  <rect width="1200" height="420" fill="url(#background)"/>
  <circle cx="600" cy="210" r="215" fill="url(#halo)"/>
  <path d="M0 56H1200M0 364H1200" stroke="#7f1d1d" stroke-opacity=".4"/>
  <text x="42" y="37" fill="#fbbf24" font-size="13" letter-spacing="3" font-weight="700">REPOPILOT</text>
  <text x="1128" y="37" text-anchor="end" fill="#9ca3af" font-size="12" letter-spacing="1.5">PUBLIC DEMO DESIGN</text>
  <text x="42" y="396" fill="#9ca3af" font-size="12">CODE INTELLIGENCE / RETRIEVAL / MCP</text>
  <text x="1128" y="396" text-anchor="end" fill="#9ca3af" font-size="12">SYNTHETIC SOURCE CONTEXT</text>

  <rect x="42" y="103" width="205" height="213" rx="14" fill="#15151c" stroke="#713f37"/>
  <text x="65" y="133" fill="#f3f4f6" font-size="16" font-weight="700">Demo repositories</text>
  <g font-size="13" font-family="monospace">
    <rect x="62" y="157" width="164" height="34" rx="7" fill="#291b1b"/>
    <path d="M78 168h9l4 4h16v12H78Z" fill="none" stroke="#fb923c" stroke-width="1.7"/>
    <text x="116" y="179" fill="#d1d5db">demo-auth/</text>
    <rect x="62" y="201" width="164" height="34" rx="7" fill="#201b1d"/>
    <path d="M78 212h9l4 4h16v12H78Z" fill="none" stroke="#fb923c" stroke-width="1.7"/>
    <text x="116" y="223" fill="#d1d5db">demo-incidents</text>
    <rect x="62" y="245" width="164" height="34" rx="7" fill="#201b1d"/>
    <path d="M78 256h9l4 4h16v12H78Z" fill="none" stroke="#fb923c" stroke-width="1.7"/>
    <text x="116" y="267" fill="#d1d5db">demo-media/</text>
  </g>

  <path d="M247 210H299" fill="none" stroke="#fb923c" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="310" y="105" width="193" height="84" rx="13" fill="#15151c" stroke="#b45309"/>
  <text x="331" y="137" fill="#f3f4f6" font-size="16" font-weight="700">BM25</text>
  <text x="331" y="160" fill="#9ca3af" font-size="12">Exact terms + symbols</text>
  <rect x="310" y="230" width="193" height="84" rx="13" fill="#15151c" stroke="#b45309"/>
  <text x="331" y="262" fill="#f3f4f6" font-size="16" font-weight="700">Semantic</text>
  <text x="331" y="285" fill="#9ca3af" font-size="12">Related code context</text>
  <path d="M299 210V147H310M299 210V272H310" fill="none" stroke="#fb923c" stroke-width="2"/>
  <path d="M503 147H545Q567 147 567 173V185M503 272H545Q567 272 567 246V230" fill="none" stroke="#fb923c" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="578" y="153" width="181" height="114" rx="16" fill="#231716" stroke="url(#accent)" stroke-width="2.5"/>
  <text x="668" y="190" text-anchor="middle" fill="#fbbf24" font-size="13" letter-spacing="2">RANK FUSION</text>
  <text x="668" y="223" text-anchor="middle" fill="#f9fafb" font-size="25" font-weight="700">RRF</text>
  <text x="668" y="246" text-anchor="middle" fill="#d1d5db" font-size="12">Source-ranked context</text>
  <path d="M759 210H808" fill="none" stroke="#fb923c" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="819" y="142" width="146" height="136" rx="14" fill="#15151c" stroke="#b45309"/>
  <text x="892" y="183" text-anchor="middle" fill="#fbbf24" font-size="14" letter-spacing="2">READ-ONLY</text>
  <text x="892" y="218" text-anchor="middle" fill="#f9fafb" font-size="24" font-weight="700">MCP</text>
  <text x="892" y="243" text-anchor="middle" fill="#9ca3af" font-size="12">search · context</text>
  <path d="M965 210H1004" fill="none" stroke="#fb923c" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1014" y="155" width="144" height="111" rx="14" fill="#15151c" stroke="#713f37"/>
  <rect x="1030" y="174" width="112" height="71" rx="5" fill="#0b0b11" stroke="#374151"/>
  <path d="M1041 193l7 6-7 6M1055 205h24" fill="none" stroke="#fbbf24" stroke-width="2"/>
  <text x="1086" y="229" text-anchor="middle" fill="#d1d5db" font-size="11">CLI agent</text>
